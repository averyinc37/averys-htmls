<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Avery's HTMLs</title>
<style>
  :root {
    --bg: #fdf8f3;
    --ink: #1c1917;
    --muted: #78716c;
    --accent: #c2410c;
    --card: #ffffff;
    --border: #e7e5e4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 20px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.1s, border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card h2 {
    margin: 0 0 4px;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Avery's HTMLs</h1>
  <p class="sub">Random pages I make.</p>
  <a class="card" href="/seville/">
    <h2>Seville · Jul 1–5, 2026</h2>
    <p>Trip agenda with maps and ticket checklist.</p>
  </a>
</main>
</body>
</html>
