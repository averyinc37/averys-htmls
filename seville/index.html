<meta name="theme-color" content="#1c1812" />
<title>Seville · Jul 1–5</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c1812'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='%23f3ecdf' font-family='-apple-system,sans-serif' font-weight='300'%3ES%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f3ecdf;
    --bg-2: #ebe2cf;
    --paper: #fbf6ec;
    --ink: #1c1812;
    --ink-2: #3a3228;
    --muted: #8a7c6c;
    --line: #ddd1bb;
    --line-soft: #e8dec9;
    --booked: #5d6a4a;
    --booked-soft: #e3e6d4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* HEADER */
  header {
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--line-soft);
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 16px 20px 8px;
  }
  .brand {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
  }
  .brand .sep { color: var(--muted); margin: 0 8px; }
  .home-btn {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 999px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: inherit;
  }
  .home-btn svg { width: 12px; height: 12px; }

  .tabs {
    display: flex; gap: 4px;
    overflow-x: auto;
    padding: 6px 20px 12px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    scroll-snap-align: start;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab[aria-selected="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  /* MAIN LAYOUT */
  main { padding: 0 0 80px; max-width: 720px; margin: 0 auto; }

  /* HERO */
  .hero {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    display: block;
    margin-bottom: 24px;
    background: var(--bg-2);
  }

  /* DAY HEADER */
  .day-header { padding: 8px 20px 28px; }
  .eyebrow {
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 14px;
  }
  .day-header h2 {
    font-size: 34px;
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.025em;
    margin: 0 0 12px;
    color: var(--ink);
  }
  .day-header p {
    color: var(--ink-2);
    margin: 0;
    font-size: 16px;
    max-width: 540px;
  }

  /* STOP — editorial, hairline-separated */
  .stops { padding: 0 20px; }
  .stop {
    padding: 26px 0;
    border-top: 1px solid var(--line-soft);
  }
  .stop:first-child { border-top: 1px solid var(--line); }
  .stop-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }
  .stop-time {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.22em;
  }
  .stop-name {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.2;
    margin: 4px 0 12px;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .stop-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    display: block;
    margin: 4px 0 16px;
    background: var(--bg-2);
  }
  .stop-notes {
    color: var(--ink-2);
    font-size: 15px;
    margin: 0 0 18px;
    line-height: 1.65;
    max-width: 580px;
  }

  /* CTA — minimal text + arrow, dark ink */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 0;
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
  }
  .cta::after { content: '→'; font-size: 13px; letter-spacing: 0; }
  .cta.outline { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .cta.subtle  { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    white-space: nowrap;
  }
  .pill.todo { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .pill.done { background: var(--booked-soft); color: var(--booked); border: 1px solid var(--booked-soft); }

  .stop.is-home .stop-name { font-style: italic; color: var(--muted); }
  .stop.is-home .stop-time { opacity: 0.7; }

  /* ESSENTIALS */
  .address-card {
    margin: 0 20px 26px;
    padding: 20px 22px;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .address-card .label {
    color: var(--muted);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .address-card .addr {
    font-size: 15px;
    color: var(--ink);
  }
  .essentials-section { padding: 0 20px; margin-bottom: 28px; }
  .essentials-section h3 {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .essential {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none;
    color: inherit;
  }
  .essential:last-child { border-bottom: none; }
  .essential-name { font-size: 15.5px; font-weight: 400; color: var(--ink); }
  .essential-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .essential-arrow {
    color: var(--ink);
    font-size: 16px;
    flex: 0 0 auto;
    transition: transform 0.15s;
  }
  .essential:hover .essential-arrow { transform: translateX(3px); }

  /* TICKETS */
  .tickets-wrap { padding: 0 20px; }
  .progress {
    padding: 16px 20px;
    margin: 0 20px 24px;
    background: var(--paper);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .progress-text {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 500;
    flex: 0 0 auto;
  }
  .progress-text strong { color: var(--ink); font-weight: 500; }
  .progress-bar {
    flex: 1;
    height: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--booked);
    transition: width 0.3s;
  }

  .ticket {
    padding: 24px 0;
    border-top: 1px solid var(--line-soft);
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .ticket:first-child { border-top: 1px solid var(--line); }
  .checkbox {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border: 1px solid var(--ink);
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .checkbox.checked {
    background: var(--ink);
    border-color: var(--ink);
  }
  .checkbox.checked::after {
    content: '';
    width: 7px; height: 12px;
    border: solid var(--bg);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .ticket-body { flex: 1; min-width: 0; }
  .ticket-when {
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    margin: 0 0 6px;
  }
  .ticket-name {
    font-size: 19px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    line-height: 1.25;
  }
  .ticket.checked .ticket-name { text-decoration: line-through; color: var(--muted); }
  .ticket-note {
    color: var(--ink-2);
    font-size: 14.5px;
    margin: 0 0 14px;
    line-height: 1.6;
  }

  @media (min-width: 720px) {
    .day-header { padding: 16px 32px 36px; }
    .stops { padding: 0 32px; }
    .essentials-section, .tickets-wrap { padding: 0 32px; }
    .address-card, .progress { margin-left: 32px; margin-right: 32px; }
    .day-header h2 { font-size: 44px; }
  }
</style>
</head>

          query: 'Parque de María Luisa Sevilla',
          image: IMG.park,
          notes: 'Shaded paths, fountains, ponds. Wander, escape the heat.',
        },
        {
          time: '12:00 PM',
          name: 'Casa Plácido',
          query: 'Casa Plácido Sevilla',
          notes: 'Old-school, walls covered in bullfighting memorabilia, near the Cathedral. Or Chinchilla back near Alameda.',
        },
        {
          time: '1:00 PM',
          name: 'Final pool afternoon',
          isHome: true,
          notes: '',
        },
        {
          time: '8:30 PM',
          name: 'Puente de Isabel II — farewell sunset',
          query: 'Puente de Isabel II Sevilla',
          image: IMG.bridge,
          notes: 'Cross into Triana. Drinks on the riverside (Abades Triana for the view, more touristy) or stand on the bridge with a beer. Golden light on Torre del Oro and the Giralda.',
        },
      ],
    },
  ];

  const essentials = [
    {
      heading: 'Groceries',
      items: [
        { name: 'Nearest supermercado', sub: 'Live results, sorted by distance', q: 'supermercado' },
        { name: 'Mercadona', sub: 'Spanish chain — best prices', q: 'Mercadona' },
        { name: 'Carrefour Express', sub: 'Smaller, often longer hours', q: 'Carrefour Express' },
        { name: 'Día', sub: 'Discount chain, typically very close', q: 'Día supermercado' },
      ],
    },
    {
      heading: 'Wine, beer & spirits',
      items: [
        { name: 'Wine shop · vinos', sub: 'Specialist bottle shops', q: 'tienda de vinos' },
        { name: 'Liquor · licorería', sub: 'Spirits, late hours', q: 'licorería' },
        { name: 'Cervecería · beer', sub: 'Cold beer to go', q: 'cervecería tienda' },
      ],
    },
    {
      heading: 'Fresh & specialty',
      items: [
        { name: 'Bakery · panadería', sub: 'Bread, breakfast pastries', q: 'panadería' },
        { name: 'Charcuterie · jamón', sub: 'Jamón ibérico, cured meats', q: 'charcutería jamón' },
        { name: 'Fruit · frutería', sub: 'Fresh fruit and vegetables', q: 'frutería' },
      ],
    },
    {
      heading: 'Other',
      items: [
        { name: 'Pharmacy · farmacia', sub: 'Look for the green cross', q: 'farmacia' },
        { name: '24h pharmacy', sub: 'Late-night needs', q: 'farmacia 24 horas' },
        { name: 'ATM · cajero', sub: 'Use bank ATMs (avoid Euronet)', q: 'cajero automático banco' },
        { name: 'Coffee · cafetería', sub: 'Morning espresso', q: 'cafetería' },
        { name: 'Tobacco shop · estanco', sub: 'Stamps and transit passes too', q: 'estanco' },
      ],
    },
  ];

  const TABS = [
    ...days.map(d => ({ id: d.id, label: d.date.split(' · ')[0] })),
    { id: 'essentials', label: 'Essentials' },
    { id: 'tickets', label: 'Tickets' },
  ];

  const TICKET_KEY = 'seville-tickets-v1';
  function getTickets() {
    try { return JSON.parse(localStorage.getItem(TICKET_KEY) || '{}'); }
    catch { return {}; }
  }
  function setTicket(id, val) {
    const s = getTickets();
    if (val) s[id] = true; else delete s[id];
    localStorage.setItem(TICKET_KEY, JSON.stringify(s));
  }

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function renderDay(day) {
    const stopsHtml = day.stops.map(s => {
      const ticketId = stopTicket[s.id];
      const checked = ticketId && getTickets()[ticketId];
      let pill = '';
      if (ticketId) {
        pill = checked
          ? '<span class="pill done">✓ Booked</span>'
          : '<span class="pill todo">Buy ticket</span>';
      }

      let action = '';
      if (!s.isHome && s.query) {
        const url = directTo(s.query, s.mode || 'walking');
        action = `<a class="cta outline" href="${url}" target="_blank" rel="noopener">Directions</a>`;
      }

      const homeClass = s.isHome ? ' is-home' : '';
      const img = s.image ? `<img class="stop-image" src="${s.image}" alt="${escapeHtml(s.name)}" loading="lazy" />` : '';

      return `
        <article class="stop${homeClass}">
          <div class="stop-meta">
            <span class="stop-time">${escapeHtml(s.time)}</span>
            ${pill}
          </div>
          <h3 class="stop-name">${escapeHtml(s.name)}</h3>
          ${img}
          ${s.notes ? `<p class="stop-notes">${escapeHtml(s.notes)}</p>` : ''}
          ${action ? `<div class="actions">${action}</div>` : ''}
        </article>
      `;
    }).join('');

    contentEl.innerHTML = `
      ${day.hero ? `<img class="hero" src="${day.hero}" alt="${escapeHtml(day.title)}" />` : ''}
      <div class="day-header">
        <div class="eyebrow">${escapeHtml(day.date)}</div>
        <h2>${escapeHtml(day.title)}</h2>
        <p>${escapeHtml(day.subtitle)}</p>
      </div>
      <div class="stops">${stopsHtml}</div>
    `;
  }

  function renderEssentials() {
    const sections = essentials.map(section => `
      <div class="essentials-section">
        <h3>${escapeHtml(section.heading)}</h3>
        ${section.items.map(it => `
          <a class="essential" href="${searchNearAirbnb(it.q)}" target="_blank" rel="noopener">
            <div>
              <div class="essential-name">${escapeHtml(it.name)}</div>
              <div class="essential-sub">${escapeHtml(it.sub)}</div>
            </div>
            <div class="essential-arrow">→</div>
          </a>
        `).join('')}
      </div>
    `).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="eyebrow">Around the apartment</div>
        <h2>Essentials</h2>
        <p>Live Google Maps searches centered on the Airbnb. Tap one — Maps shows the nearest options sorted by distance.</p>
      </div>
      <div class="address-card">
        <div class="label">Apartment</div>
        <div class="addr">${escapeHtml(AIRBNB)}</div>
      </div>
      ${sections}
    `;
  }

  function renderTickets() {
    const state = getTickets();
    const done = tickets.filter(t => state[t.id]).length;
    const total = tickets.length;
    const pct = total ? (done / total) * 100 : 0;

    const items = tickets.map(t => {
      const isChecked = !!state[t.id];
      return `
        <div class="ticket ${isChecked ? 'checked' : ''}">
          <button class="checkbox ${isChecked ? 'checked' : ''}" aria-label="Toggle booked" data-toggle="${t.id}"></button>
          <div class="ticket-body">
            <p class="ticket-when">${escapeHtml(t.when)}</p>
            <p class="ticket-name">${escapeHtml(t.name)}</p>
            <p class="ticket-note">${escapeHtml(t.note)}</p>
            <a class="cta" href="${t.url}" target="_blank" rel="noopener">Book</a>
          </div>
        </div>
      `;
    }).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="eyebrow">Book in advance</div>
        <h2>Tickets to buy</h2>
        <p>Tap the box once you’ve booked. The agenda flips to “Booked”.</p>
      </div>
      <div class="progress">
        <div class="progress-text"><strong>${done}</strong> of ${total} booked</div>
        <div class="progress-bar"><div style="width:${pct}%"></div></div>
      </div>
      <div class="tickets-wrap">${items}</div>
    `;

    contentEl.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        setTicket(id, !getTickets()[id]);
        renderTickets();
      });
    });
  }

  function render(activeId) {
    tabsEl.innerHTML = TABS.map(t => `
      <button class="tab" role="tab" aria-selected="${t.id === activeId}" data-id="${t.id}">${t.label}</button>
    `).join('');
    tabsEl.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        const id = t.dataset.id;
        sessionStorage.setItem('seville-active', id);
        render(id);
        window.scrollTo({ top: 0 });
      });
    });

    if (activeId === 'tickets') renderTickets();
    else if (activeId === 'essentials') renderEssentials();
    else {
      const day = days.find(d => d.id === activeId) || days[0];
      renderDay(day);
    }
  }

  function initialId() {
    const session = sessionStorage.getItem('seville-active');
    if (session) return session;
    const now = new Date();
    if (now.getFullYear() === 2026 && now.getMonth() === 6) {
      const map = { 1:'wed', 2:'thu', 3:'fri', 4:'sat', 5:'sun' };
      if (map[now.getDate()]) return map[now.getDate()];
    }
    return 'wed';
  }
  render(initialId());
</script>
</body>
</html>
