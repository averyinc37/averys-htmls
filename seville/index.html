<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c1812" />
<title>Seville → Granada → Málaga · Jul 1–10</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c1812'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='%23f3ecdf' font-family='-apple-system,sans-serif' font-weight='300'%3ES%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f3ecdf;
    --bg-2: #ebe2cf;
    --paper: #fbf6ec;
    --ink: #1c1812;
    --ink-2: #3a3228;
    --muted: #8a7c6c;
    --line: #ddd1bb;
    --line-soft: #e8dec9;
    --booked: #5d6a4a;
    --booked-soft: #e3e6d4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* HEADER */
  header {
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--line-soft);
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 16px 20px 8px;
    flex-wrap: wrap;
  }
  .home-btns { display: flex; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; }
  .brand {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
  }
  .brand .sep { color: var(--muted); margin: 0 8px; }
  .home-btn {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 999px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: inherit;
  }
  .home-btn svg { width: 12px; height: 12px; }

  .tabs {
    display: flex; gap: 4px;
    overflow-x: auto;
    padding: 6px 20px 12px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    scroll-snap-align: start;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab[aria-selected="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  /* NAV DROPDOWNS */
  .nav { display: flex; gap: 8px; padding: 6px 20px 12px; flex-wrap: wrap; }
  .menu { position: relative; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent;
    font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .nav-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .nav-btn .chev { font-size: 9px; }
  .menu-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    min-width: 190px; background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(28,24,18,0.14);
    padding: 6px; display: none; max-height: 64vh; overflow-y: auto;
  }
  .menu.open .menu-panel { display: block; }
  .menu-item {
    display: block; width: 100%; text-align: left;
    padding: 9px 12px; border: none; background: transparent;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-2); cursor: pointer; font-family: inherit;
  }
  .menu-item:hover { background: var(--bg-2); }
  .menu-item.active { color: var(--ink); font-weight: 600; }

  /* DANCE / VENUES */
  .venue { padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
  .venue:last-child { border-bottom: none; }
  .venue-name { font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .venue-summary { color: var(--ink-2); font-size: 14.5px; margin: 0 0 10px; line-height: 1.6; }
  .venue-meta { font-size: 13px; color: var(--muted); margin: 0 0 6px; line-height: 1.55; }
  .venue-meta strong { color: var(--ink-2); font-weight: 500; }
  .venue-addr {
    display: inline-block; margin-top: 8px; font-size: 13.5px;
    color: var(--ink); text-decoration: none;
    border-bottom: 1px solid var(--line); padding-bottom: 2px;
  }
  .venue-addr:hover { border-color: var(--ink); }

  /* MAP */
  .map-wrap { padding: 8px 20px 44px; }
  .map-frame { width: 100%; height: 340px; border: 1px solid var(--line); display: block; }
  .map-cap { font-size: 12px; color: var(--muted); margin-top: 10px; max-width: 580px; }

  /* STEP-BY-STEP EXPANDERS */
  .steps { border-top: 1px solid var(--line-soft); margin-top: 16px; }
  .steps summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0;
    font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 500; color: var(--ink);
  }
  .steps summary::-webkit-details-marker { display: none; }
  .steps-plus {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    border: 1px solid var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }
  .steps-plus::after { content: '+'; }
  .steps[open] .steps-plus::after { content: '−'; }
  .steps-body { padding: 2px 0 16px; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
  .steps-body h4 {
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); margin: 14px 0 6px; font-weight: 600;
  }
  .steps-body ul { margin: 0 0 12px; padding-left: 18px; }
  .steps-body li { margin-bottom: 6px; }
  .steps-body p { margin: 8px 0; }
  .steps-sub { font-weight: 600; color: var(--ink); font-size: 13.5px; }
  .steps-src { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .steps-src a { color: var(--muted); }
  .stop-steps { padding: 18px 0; }
  .stop-steps .steps { border-top: none; margin-top: 0; }
  .stop-steps summary { padding: 0; }

  /* MAIN LAYOUT */
  main { padding: 0 0 80px; max-width: 720px; margin: 0 auto; }

  /* HERO */
  .hero {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    display: block;
    margin-bottom: 24px;
    background: var(--bg-2);
  }

  /* DAY HEADER */
  .day-header { padding: 8px 20px 28px; }
  .eyebrow {
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 14px;
  }
  .day-header h2 {
    font-size: 34px;
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.025em;
    margin: 0 0 12px;
    color: var(--ink);
  }
  .day-header p {
    color: var(--ink-2);
    margin: 0;
    font-size: 16px;
    max-width: 540px;
  }

  /* STOP — editorial, hairline-separated */
  .stops { padding: 0 20px; }
  .stop {
    padding: 26px 0;
    border-top: 1px solid var(--line-soft);
  }
  .stop:first-child { border-top: 1px solid var(--line); }
  .stop-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }
  .stop-time {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.22em;
  }
  .stop-name {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.2;
    margin: 4px 0 12px;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .stop-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    display: block;
    margin: 4px 0 16px;
    background: var(--bg-2);
  }
  .stop-notes {
    color: var(--ink-2);
    font-size: 15px;
    margin: 0 0 18px;
    line-height: 1.65;
    max-width: 580px;
  }

  /* CTA — minimal text + arrow, dark ink */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 0;
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
  }
  .cta::after { content: '→'; font-size: 13px; letter-spacing: 0; }
  .cta.outline { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .cta.subtle  { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    white-space: nowrap;
  }
  .pill.todo { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .pill.done { background: var(--booked-soft); color: var(--booked); border: 1px solid var(--booked-soft); }

  .stop.is-home .stop-name { font-style: italic; color: var(--muted); }
  .stop.is-home .stop-time { opacity: 0.7; }

  /* ESSENTIALS */
  .address-card {
    margin: 0 20px 26px;
    padding: 20px 22px;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .address-card .label {
    color: var(--muted);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .address-card .addr {
    font-size: 15px;
    color: var(--ink);
  }
  .essentials-section { padding: 0 20px; margin-bottom: 28px; }
  .essentials-section h3 {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .essential {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none;
    color: inherit;
  }
  .essential:last-child { border-bottom: none; }
  .essential-name { font-size: 15.5px; font-weight: 400; color: var(--ink); }
  .essential-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .essential-arrow {
    color: var(--ink);
    font-size: 16px;
    flex: 0 0 auto;
    transition: transform 0.15s;
  }
  .essential:hover .essential-arrow { transform: translateX(3px); }

  /* TICKETS */
  .tickets-wrap { padding: 0 20px; }
  .progress {
    padding: 16px 20px;
    margin: 0 20px 24px;
    background: var(--paper);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .progress-text {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 500;
    flex: 0 0 auto;
  }
  .progress-text strong { color: var(--ink); font-weight: 500; }
  .progress-bar {
    flex: 1;
    height: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--booked);
    transition: width 0.3s;
  }

  .ticket {
    padding: 24px 0;
    border-top: 1px solid var(--line-soft);
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .ticket:first-child { border-top: 1px solid var(--line); }
  .checkbox {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border: 1px solid var(--ink);
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .checkbox.checked {
    background: var(--ink);
    border-color: var(--ink);
  }
  .checkbox.checked::after {
    content: '';
    width: 7px; height: 12px;
    border: solid var(--bg);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .ticket-body { flex: 1; min-width: 0; }
  .ticket-when {
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    margin: 0 0 6px;
  }
  .ticket-name {
    font-size: 19px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    line-height: 1.25;
  }
  .ticket.checked .ticket-name { text-decoration: line-through; color: var(--muted); }
  .ticket-note {
    color: var(--ink-2);
    font-size: 14.5px;
    margin: 0 0 14px;
    line-height: 1.6;
  }

  @media (min-width: 720px) {
    .day-header { padding: 16px 32px 36px; }
    .stops { padding: 0 32px; }
    .essentials-section, .tickets-wrap { padding: 0 32px; }
    .address-card, .progress { margin-left: 32px; margin-right: 32px; }
    .day-header h2 { font-size: 44px; }
    .map-wrap { padding-left: 32px; padding-right: 32px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="brand">Seville → Granada → Málaga <span class="sep">·</span> Jul 1–10</div>
    <div class="home-btns">
      <a class="home-btn" id="home-btn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
        Airbnb Seville
      </a>
      <a class="home-btn" id="home-btn-granada" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
        Airbnb Granada
      </a>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<main id="content"></main>
<script>
  const AIRBNB = 'C/ de Sta. Clara, 4, Casco Antiguo, 41002 Sevilla, Spain';
  const AIRBNB_GRANADA = 'Calle Hoteles Belén Calle C, 8, 18009 Granada, Spain';

  const directTo = (q, mode = 'walking') =>
    `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}&travelmode=${mode}`;
  const directBetween = (from, to, mode = 'walking') =>
    `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=${mode}`;
  const searchNearAirbnb = (q) =>
    `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + ' near ' + AIRBNB)}`;

  document.getElementById('home-btn').href = directTo(AIRBNB, 'walking');
  document.getElementById('home-btn-granada').href = directTo(AIRBNB_GRANADA, 'walking');

  // image library — Wikimedia Commons URLs (stable, hotlinkable)
  const IMG = {
    alameda: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Alameda_de_H%C3%A9rcules.JPG/1280px-Alameda_de_H%C3%A9rcules.JPG',
    setas:   'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Metropolparasolnov2011001.jpg/1280px-Metropolparasolnov2011001.jpg',
    alcazar: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Sevilla-2-2_%2848040287512%29-edit.jpg/1280px-Sevilla-2-2_%2848040287512%29-edit.jpg',
    triana:  'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Sevilla-3-12_%2848040411218%29.jpg/1280px-Sevilla-3-12_%2848040411218%29.jpg',
    bridge:  'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Pont_Triana.jpg/1280px-Pont_Triana.jpg',
    plaza:   'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Plaza_de_Espa%C3%B1a_%28Sevilla%29_-_01.jpg/1280px-Plaza_de_Espa%C3%B1a_%28Sevilla%29_-_01.jpg',
    park:    'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Parque_de_Mar%C3%ADa_Luisa_%282%29.jpg/1280px-Parque_de_Mar%C3%ADa_Luisa_%282%29.jpg',
    cathedral: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Sevilla_Cathedral_-_Southeast.jpg/1280px-Sevilla_Cathedral_-_Southeast.jpg',
    granada: 'https://commons.wikimedia.org/wiki/Special:FilePath/Alhambra_evening_panorama_Mirador_San_Nicolas_sRGB-1.jpg?width=1280',
  };

  const tickets = [
    {
      id: 'alcazar-day',
      name: 'Real Alcázar — private guided tour',
      when: 'Fri Jul 3 · 11:30 AM',
      note: 'Private guided tour, 11:30 AM — covers interiors + Royal Apartments.',
      url: 'https://www.alcazarsevilla.org/',
      booked: true,
    },
    {
      id: 'flamenco',
      name: 'Casa de la Memoria flamenco',
      when: 'Fri Jul 3 · 9:00 PM',
      note: '~€24, ~50 seats, ~75 min. Book ~3–5 days out. Arrive 30 min early for first-come seats.',
      url: 'https://casadelamemoria.es/',
      booked: false,
    },
    {
      id: 'alcazar-concert',
      name: 'Real Alcázar — night garden concert',
      when: 'Sat Jul 4 · 9:00 PM',
      note: 'Mozart & Schubert piano. Patio de Butacas, Row 17. Gates close 10:25 PM sharp.',
      url: 'https://www.alcazarsevilla.org/',
      booked: true,
    },
    {
      id: 'car-transfer',
      name: 'Transportation — Granada → Málaga (TBD)',
      when: 'Wed Jul 8',
      note: 'Book transport from Granada to Málaga on Jul 8 — train, bus, or private transfer (~1.5–2.5 hr). Still to decide.',
      url: 'https://www.google.com/maps/dir/?api=1&origin=Granada%2C+Spain&destination=M%C3%A1laga%2C+Spain&travelmode=driving',
      booked: false,
    },
  ];
  const stopTicket = {
    'fri-alcazar': 'alcazar-day',
    'fri-flamenco': 'flamenco',
    'sat-alcazar-entry': 'alcazar-concert',
    'sat-gardens': 'alcazar-concert',
    'sat-seats': 'alcazar-concert',
    'sat-concert': 'alcazar-concert',
  };

  const GUIDE_MALAGA = `
    <h4>Step 1 · Step inside the station</h4>
    <ul>
      <li>Have your driver drop you at the main entrance of Málaga-María Zambrano station (it shares a building with the Vialia Shopping Mall).</li>
      <li>Walk past the doors straight into the large, open main concourse.</li>
    </ul>
    <h4>Step 2 · Head to the security checkpoints</h4>
    <ul>
      <li>Look straight ahead to the back of the hall — you'll see the luggage X-ray lines and ticket gates.</li>
      <li>Check the overhead boards for your platform, but all mainline trains are on this ground floor. No elevators or stairs — the tracks are all at ground level.</li>
    </ul>
    <h4>Step 3 · Clear the luggage check</h4>
    <ul>
      <li>Have your boarding barcodes ready on your phone (or paper).</li>
      <li>Lay your three large suitcases flat on the X-ray conveyor. No need to pull out liquids or laptops — it's a quick check for large hazards only.</li>
      <li>Scan your ticket barcodes at the gate to enter the departures zone.</li>
    </ul>
    <h4>Step 4 · Find Coach 1 and board</h4>
    <ul>
      <li>Walk down your assigned platform.</li>
      <li>Use the screens over the platform or the labels on the cars to find Coche 1 (Coach 1). Heading toward Seville, Coach 1 is usually farthest down the platform — keep walking.</li>
      <li>Step onto Coach 1 and drop your three suitcases onto the metal luggage racks right at the entrance.</li>
    </ul>
    <h4>Step 5 · Take your seats</h4>
    <ul>
      <li>Walk down the aisle of Coach 1.</li>
      <li>Find Seat 2C and the seat next to it, right at the front of the cabin. Sit back and enjoy the ride to Seville.</li>
    </ul>
    <p class="steps-src">Sources:
      <a href="https://www.tripadvisor.com/ShowTopic-g187438-i333-k15410945-Malaga_Maria_Zambrano_security-Malaga_Costa_del_Sol_Province_of_Malaga_Andalucia.html" target="_blank" rel="noopener">1</a>,

          walk: '~25 min walk from the Airbnb',
        },
        {
          name: 'Sopa de Ganso',
          summary: 'A loud, crowded, deeply fun university bar in the student-heavy Alfalfa neighborhood. Famous for cheap drinks, high-volume international music and a wall-to-wall social vibe.',
          nights: 'Open 7 nights a week. A pure student hub, so it stays busy even on weeknights like Tuesday and Wednesday.',
          address: 'C. Pérez Galdós, 8, Casco Antiguo, 41004 Sevilla',
          walk: '~16 min walk from the Airbnb',
        },
      ],
    },
    {
      heading: 'After-Midnight Megaclubs',
      time: '2:00 AM – 6:00 AM',
      venues: [
        {
          name: 'KOKO',
          summary: 'Under Las Setas, the top pick for international students. DJs spin heavy EDM mashups (The Chainsmokers, Calvin Harris) and global Top 40 hits.',
          nights: 'Open 7 nights a week. Tuesday is the mandatory night for study-abroad students (huge international/Erasmus parties); Thursday, Friday and Saturday are also big.',
          address: 'Pl. de la Encarnación, 38, Casco Antiguo, 41003 Sevilla',
          walk: '~12 min walk from the Airbnb',
        },
        {
          name: 'Uthopía Sevilla',
          summary: 'A sprawling 3-story megaclub inside an old station complex. Draws a big American student crowd to its Commercial/Pop floor for English radio remixes.',
          nights: 'Open Wednesday–Sunday (closed Monday and Tuesday). Thursday is the most popular university weeknight; Friday and Saturday draw the biggest crowds.',
          address: 'Pl. la Legión, s/n, Casco Antiguo, 41001 Sevilla',
          walk: '~18 min walk from the Airbnb',
        },
      ],
    },
  ];

  const NAV_OTHER = [
    { id: 'essentials', label: 'Essentials' },
    { id: 'dance', label: 'Sevilla Dance' },
  ];
  const dayLabel = (id) => {
    const d = days.find(x => x.id === id);
    return d ? d.date.replace(' · Jul', '') : '';
  };

  const TICKET_KEY = 'seville-tickets-v1';
  function getTickets() {
    try { return JSON.parse(localStorage.getItem(TICKET_KEY) || '{}'); }
    catch { return {}; }
  }
  function setTicket(id, val) {
    const s = getTickets();
    s[id] = !!val;
    localStorage.setItem(TICKET_KEY, JSON.stringify(s));
  }
  function ticketChecked(id) {
    const state = getTickets();
    if (Object.prototype.hasOwnProperty.call(state, id)) return state[id];
    const t = tickets.find(x => x.id === id);
    return t ? !!t.booked : false;
  }

  const navEl = document.getElementById('nav');
  const contentEl = document.getElementById('content');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function renderDay(day) {
    const stopsHtml = day.stops.map(s => {
      if (s.stepsOnly) {
        const only = (s.steps || []).map(st => `
          <details class="steps">
            <summary><span class="steps-plus"></span>${escapeHtml(st.label)}</summary>
            <div class="steps-body">${st.html}</div>
          </details>
        `).join('');
        return `<article class="stop stop-steps">${only}</article>`;
      }
      const ticketId = stopTicket[s.id];
      const checked = ticketId && ticketChecked(ticketId);
      let pill = '';
      if (ticketId) {
        pill = checked
          ? '<span class="pill done">✓ Booked</span>'
          : '<span class="pill todo">Buy ticket</span>';
      }

      let action = '';
      if (!s.isHome && s.query) {
        const url = s.from
          ? directBetween(s.from, s.query, s.mode || 'walking')
          : directTo(s.query, s.mode || 'walking');
        action = `<a class="cta outline" href="${url}" target="_blank" rel="noopener">Directions</a>`;
      }

      const homeClass = s.isHome ? ' is-home' : '';
      const img = s.image ? `<img class="stop-image" src="${s.image}" alt="${escapeHtml(s.name)}" loading="lazy" />` : '';
      const steps = (s.steps || []).map(st => `
        <details class="steps">
          <summary><span class="steps-plus"></span>${escapeHtml(st.label)}</summary>
          <div class="steps-body">${st.html}</div>
        </details>
      `).join('');

      return `
        <article class="stop${homeClass}">
          <div class="stop-meta">
            <span class="stop-time">${escapeHtml(s.time)}</span>
            ${pill}
          </div>
          <h3 class="stop-name">${escapeHtml(s.name)}</h3>
          ${img}
          ${s.notes ? `<p class="stop-notes">${escapeHtml(s.notes)}</p>` : ''}
          ${action ? `<div class="actions">${action}</div>` : ''}
          ${steps}
        </article>
      `;
    }).join('');

    contentEl.innerHTML = `
      ${day.hero ? `<img class="hero" src="${day.hero}" alt="${escapeHtml(day.title)}" />` : ''}
      <div class="day-header">
        <div class="eyebrow">${escapeHtml(day.date)}</div>
        <h2>${escapeHtml(day.title)}</h2>
        <p>${escapeHtml(day.subtitle)}</p>
      </div>
      <div class="stops">${stopsHtml}</div>
    `;
  }

  function renderEssentials() {
    const sections = essentials.map(section => `
      <div class="essentials-section">
        <h3>${escapeHtml(section.heading)}</h3>
        ${section.items.map(it => `
          <a class="essential" href="${searchNearAirbnb(it.q)}" target="_blank" rel="noopener">
            <div>
              <div class="essential-name">${escapeHtml(it.name)}</div>
              <div class="essential-sub">${escapeHtml(it.sub)}</div>
            </div>
            <div class="essential-arrow">→</div>
          </a>
        `).join('')}
      </div>
    `).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="eyebrow">Around the apartment</div>
        <h2>Essentials</h2>
        <p>Live Google Maps searches centered on the Airbnb. Tap one — Maps shows the nearest options sorted by distance.</p>
      </div>
      <div class="address-card">
        <div class="label">Apartment</div>
        <div class="addr">${escapeHtml(AIRBNB)}</div>
      </div>
      ${sections}
    `;
  }

  function renderDance() {
    const sections = danceVenues.map(sec => `
      <div class="essentials-section">
        <h3>${escapeHtml(sec.heading)} · ${escapeHtml(sec.time)}</h3>
        ${sec.venues.map(v => `
          <div class="venue">
            <div class="venue-name">${escapeHtml(v.name)}</div>
            <p class="venue-summary">${escapeHtml(v.summary)}</p>
            <p class="venue-meta"><strong>Nights:</strong> ${escapeHtml(v.nights)}</p>
            <p class="venue-meta"><strong>Getting there:</strong> ${escapeHtml(v.walk)}</p>
            <a class="venue-addr" href="${directTo(v.address, 'walking')}" target="_blank" rel="noopener">${escapeHtml(v.address)} →</a>
          </div>
        `).join('')}
      </div>
    `).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="eyebrow">Nightlife</div>
        <h2>Sevilla Dance</h2>
        <p>Where the night actually goes — pre-midnight party bars, then the after-midnight megaclubs. Tap any address to open walking directions in Google Maps.</p>
      </div>
      ${sections}
      <div class="map-wrap">
        <iframe class="map-frame" src="https://www.google.com/maps?q=${encodeURIComponent(AIRBNB)}&z=14&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Seville nightlife map"></iframe>
        <p class="map-cap">Centred on the Airbnb (C/ de Sta. Clara, 4). Every venue is inside the Casco Antiguo — tap an address above to navigate.</p>
      </div>
    `;
  }

  function renderTickets() {
    const done = tickets.filter(t => ticketChecked(t.id)).length;
    const total = tickets.length;
    const pct = total ? (done / total) * 100 : 0;

    const items = tickets.map(t => {
      const isChecked = ticketChecked(t.id);
      return `
        <div class="ticket ${isChecked ? 'checked' : ''}">
          <button class="checkbox ${isChecked ? 'checked' : ''}" aria-label="Toggle booked" data-toggle="${t.id}"></button>
          <div class="ticket-body">
            <p class="ticket-when">${escapeHtml(t.when)}</p>
            <p class="ticket-name">${escapeHtml(t.name)}</p>
            <p class="ticket-note">${escapeHtml(t.note)}</p>
            <a class="cta" href="${t.url}" target="_blank" rel="noopener">Book</a>
          </div>
        </div>
      `;
    }).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="eyebrow">Before you go</div>
        <h2>To-do</h2>
        <p>Everything still to book. Tap the box once it’s done — it flips to “Booked”.</p>
      </div>
      <div class="progress">
        <div class="progress-text"><strong>${done}</strong> of ${total} booked</div>
        <div class="progress-bar"><div style="width:${pct}%"></div></div>
      </div>
      <div class="tickets-wrap">${items}</div>
    `;

    contentEl.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        setTicket(id, !ticketChecked(id));
        renderTickets();
      });
    });
  }

  function go(id) {
    sessionStorage.setItem('seville-active', id);
    render(id);
    window.scrollTo({ top: 0 });
  }

  function buildNav(activeId) {
    const isDay = days.some(d => d.id === activeId);
    const otherActive = NAV_OTHER.find(o => o.id === activeId);
    const dateBtnLabel = isDay ? ('Date · ' + dayLabel(activeId)) : 'Date';
    const otherBtnLabel = otherActive ? ('Other · ' + otherActive.label) : 'Other';

    const dayItems = days.map(d =>
      `<button class="menu-item ${d.id === activeId ? 'active' : ''}" data-id="${d.id}">${escapeHtml(d.date)}</button>`
    ).join('');
    const otherItems = NAV_OTHER.map(o =>
      `<button class="menu-item ${o.id === activeId ? 'active' : ''}" data-id="${o.id}">${escapeHtml(o.label)}</button>`
    ).join('');

    navEl.innerHTML = `
      <button class="nav-btn ${activeId === 'today' ? 'active' : ''}" data-id="today">Today</button>
      <button class="nav-btn ${activeId === 'tickets' ? 'active' : ''}" data-id="tickets">To-do</button>
      <div class="menu" data-menu="date">
        <button class="nav-btn ${isDay ? 'active' : ''}" data-menu-toggle="date">${escapeHtml(dateBtnLabel)} <span class="chev">▾</span></button>
        <div class="menu-panel">${dayItems}</div>
      </div>
      <div class="menu" data-menu="other">
        <button class="nav-btn ${otherActive ? 'active' : ''}" data-menu-toggle="other">${escapeHtml(otherBtnLabel)} <span class="chev">▾</span></button>
        <div class="menu-panel">${otherItems}</div>
      </div>
    `;

    navEl.querySelectorAll('[data-menu-toggle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const menu = btn.closest('.menu');
        const isOpen = menu.classList.contains('open');
        navEl.querySelectorAll('.menu').forEach(m => m.classList.remove('open'));
        if (!isOpen) menu.classList.add('open');
      });
    });
    navEl.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        go(el.dataset.id);
      });
    });
  }

  function todayDayId() {
    const now = new Date();
    if (now.getFullYear() === 2026 && now.getMonth() === 6) {
      const map = { 1:'wed', 2:'thu', 3:'fri', 4:'sat', 5:'sun', 6:'mon', 7:'tue', 8:'wed8', 9:'thu9', 10:'fri10' };
      if (map[now.getDate()]) return map[now.getDate()];
    }
    return null;
  }

  function render(activeId) {
    buildNav(activeId);
    if (activeId === 'today') {
      const id = todayDayId() || days[0].id;
      renderDay(days.find(d => d.id === id) || days[0]);
    }
    else if (activeId === 'tickets') renderTickets();
    else if (activeId === 'essentials') renderEssentials();
    else if (activeId === 'dance') renderDance();
    else {
      const day = days.find(d => d.id === activeId) || days[0];
      renderDay(day);
    }
  }

  document.addEventListener('click', () => {
    navEl.querySelectorAll('.menu').forEach(m => m.classList.remove('open'));
  });

  render('today');
</script>
</body>
</html>
