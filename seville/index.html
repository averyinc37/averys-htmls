<style>
  :root {
    --bg: #fbf6ee;
    --bg-2: #f5ede0;
    --ink: #1c1410;
    --muted: #847268;
    --accent: #9a3412;
    --accent-soft: #fde4cf;
    --booked: #166534;
    --booked-soft: #dcfce7;
    --card: #ffffff;
    --border: #ebe1d2;
    --shadow: 0 1px 2px rgba(28, 20, 16, 0.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .serif {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  header {
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 6px;
  }
  .title-block h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.015em;
  }
  .title-block .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 1px;
  }
  .home-btn {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 13px;
    background: var(--accent);
    color: white;
    border-radius: 999px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    border: none;
    box-shadow: var(--shadow);
    font-family: inherit;
  }
  .home-btn svg { width: 14px; height: 14px; }

  .tabs {
    display: flex; gap: 6px;
    overflow-x: auto;
    padding: 6px 16px 10px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    scroll-snap-align: start;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab[aria-selected="true"] {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }

  main { padding: 18px 16px 80px; max-width: 640px; margin: 0 auto; }

  .day-header { margin-bottom: 18px; }
  .day-eyebrow {
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .day-header h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .day-header p {
    color: var(--muted);
    margin: 0;
    font-size: 15px;
  }

  .stop {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .stop-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px;
  }
  .stop-time {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .stop-name {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.25;
    margin: 4px 0 6px;
    letter-spacing: -0.01em;
  }
  .stop-notes { color: #3f342e; font-size: 14.5px; margin: 0 0 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    background: var(--accent);
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn.secondary {
    background: white;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn.subtle {
    background: var(--bg-2);
    color: var(--ink);
    border: 1px solid transparent;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .pill.todo { background: var(--accent-soft); color: var(--accent); }
  .pill.done { background: var(--booked-soft); color: var(--booked); }

  .stop.is-home { background: var(--bg-2); border-style: dashed; box-shadow: none; }
  .stop.is-home .stop-name { font-style: italic; }

  /* tickets page */
  .ticket {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: var(--shadow);
  }
  .ticket.checked { background: var(--booked-soft); border-color: #bbf7d0; }
  .checkbox {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    transition: all 0.1s;
  }
  .checkbox.checked {
    background: var(--booked);
    border-color: var(--booked);
  }
  .checkbox.checked::after {
    content: '';
    width: 7px; height: 12px;
    border: solid white;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .ticket-body { flex: 1; min-width: 0; }
  .ticket-name {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
  }
  .ticket-when { color: var(--accent); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 6px; }
  .ticket-note { color: #3f342e; font-size: 14px; margin: 0 0 10px; }
  .ticket.checked .ticket-name { text-decoration: line-through; opacity: 0.7; }

  .progress {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .progress-text { font-size: 13px; color: var(--muted); }
  .progress-text strong { color: var(--ink); }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--booked);
    transition: width 0.2s;
  }

  /* essentials page */
  .essentials-section { margin-bottom: 22px; }
  .essentials-section h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .essential {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 13px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
  }
  .essential-name { font-size: 14.5px; font-weight: 500; }
  .essential-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .essential-arrow { color: var(--muted); font-size: 18px; }

  .address-card {
    background: var(--bg-2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 13.5px;
    color: #3f342e;
  }
  .address-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
</style>
</head>

  const tickets = [

  const TICKET_KEY = 'seville-tickets-v1';
  function getTickets() {
    try { return JSON.parse(localStorage.getItem(TICKET_KEY) || '{}'); }
    catch { return {}; }
  }
  function setTicket(id, val) {
    const s = getTickets();
    if (val) s[id] = true; else delete s[id];
    localStorage.setItem(TICKET_KEY, JSON.stringify(s));
  }

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function renderDay(day) {
    const stopsHtml = day.stops.map(s => {
      const ticketId = stopTicket[s.id];
      const checked = ticketId && getTickets()[ticketId];
      let pill = '';
      if (ticketId) {
        pill = checked
          ? '<span class="pill done">✓ Booked</span>'
          : '<span class="pill todo">Buy ticket</span>';
      }

      let action = '';
      if (s.isHome) {
        // Home / pool entries — no maps button
        action = '';
      } else if (s.query) {
        const url = directTo(s.query, s.mode || 'walking');
        action = `<a class="btn" href="${url}" target="_blank" rel="noopener">Directions</a>`;
      }

      const homeClass = s.isHome ? ' is-home' : '';

      return `
        <div class="stop${homeClass}">
          <div class="stop-header">
            <div class="stop-time">${escapeHtml(s.time)}</div>
            ${pill}
          </div>
          <div class="stop-name">${escapeHtml(s.name)}</div>
          ${s.notes ? `<p class="stop-notes">${escapeHtml(s.notes)}</p>` : ''}
          ${action ? `<div class="actions">${action}</div>` : ''}
        </div>
      `;
    }).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="day-eyebrow">${escapeHtml(day.date)}</div>
        <h2>${escapeHtml(day.title)}</h2>
        <p>${escapeHtml(day.subtitle)}</p>
      </div>
      ${stopsHtml}
    `;
  }

  function renderEssentials() {
    const sections = essentials.map(section => `
      <div class="essentials-section">
        <h3>${escapeHtml(section.heading)}</h3>
        ${section.items.map(it => `
          <a class="essential" href="${searchNearAirbnb(it.q)}" target="_blank" rel="noopener">
            <div>
              <div class="essential-name">${escapeHtml(it.name)}</div>
              <div class="essential-sub">${escapeHtml(it.sub)}</div>
            </div>
            <div class="essential-arrow">›</div>
          </a>
        `).join('')}
      </div>
    `).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="day-eyebrow">Around the Airbnb</div>
        <h2>Essentials</h2>
        <p>Live Google Maps searches centered on the apartment. Tap one — Maps shows the nearest options sorted by distance.</p>
      </div>
      <div class="address-card">
        <div class="label">Apartment</div>
        ${escapeHtml(AIRBNB)}
      </div>
      ${sections}
    `;
  }

  function renderTickets() {
    const state = getTickets();
    const done = tickets.filter(t => state[t.id]).length;
    const total = tickets.length;
    const pct = total ? (done / total) * 100 : 0;

    const items = tickets.map(t => {
      const isChecked = !!state[t.id];
      return `
        <div class="ticket ${isChecked ? 'checked' : ''}" data-id="${t.id}">
          <button class="checkbox ${isChecked ? 'checked' : ''}" aria-label="Toggle booked" data-toggle="${t.id}"></button>
          <div class="ticket-body">
            <p class="ticket-when">${escapeHtml(t.when)}</p>
            <p class="ticket-name">${escapeHtml(t.name)}</p>
            <p class="ticket-note">${escapeHtml(t.note)}</p>
            <a class="btn" href="${t.url}" target="_blank" rel="noopener">Book →</a>
          </div>
        </div>
      `;
    }).join('');

    contentEl.innerHTML = `
      <div class="day-header">
        <div class="day-eyebrow">Book in advance</div>
        <h2>Tickets to buy</h2>
        <p>Tap the box once you’ve booked. The agenda will switch to “✓ Booked”.</p>
      </div>
      <div class="progress">
        <div class="progress-bar"><div style="width:${pct}%"></div></div>
        <div class="progress-text"><strong>${done}</strong> of ${total} booked</div>
      </div>
      ${items}
    `;

    contentEl.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggle;
        setTicket(id, !getTickets()[id]);
        renderTickets();
      });
    });
  }

  function render(activeId) {
    tabsEl.innerHTML = TABS.map(t => `
      <button class="tab" role="tab" aria-selected="${t.id === activeId}" data-id="${t.id}">${t.label}</button>
    `).join('');
    tabsEl.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        const id = t.dataset.id;
        sessionStorage.setItem('seville-active', id);
        render(id);
        window.scrollTo({ top: 0 });
      });
    });

    if (activeId === 'tickets') renderTickets();
    else if (activeId === 'essentials') renderEssentials();
    else {
      const day = days.find(d => d.id === activeId) || days[0];
      renderDay(day);
    }
  }

  function initialId() {
    const session = sessionStorage.getItem('seville-active');
    if (session) return session;
    const now = new Date();
    if (now.getFullYear() === 2026 && now.getMonth() === 6) {
      const map = { 1:'wed', 2:'thu', 3:'fri', 4:'sat', 5:'sun' };
      if (map[now.getDate()]) return map[now.getDate()];
    }
    return 'wed';
  }
  render(initialId());
</script>
</body>
</html>
